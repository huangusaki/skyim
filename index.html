<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>风刃草偃</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #070709;
  font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  color: #f0e8d8;
}

#game-root {
  position: relative;
  width: 100vw;
  height: 100vh;
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.hidden {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* =========================================================================
   1. DYNAMIC SUMI-E & CRIMSON MAPLE LOADING SCREEN
   ========================================================================= */
#loading-screen {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: #070709;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1);
}

#loading-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.loading-center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.loading-seal {
  padding: 2px 10px;
  border: 1px solid rgba(188, 42, 32, 0.72);
  color: #d94638;
  font-size: 11px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
}

.loading-title {
  font-size: clamp(38px, 5.2vw, 62px);
  font-weight: 400;
  letter-spacing: 0.36em;
  text-indent: 0.36em;
  color: #f6efe2;
  text-shadow: 0 8px 34px rgba(0, 0, 0, 0.92);
}

.loading-bar-wrap {
  position: relative;
  width: min(320px, 64vw);
  height: 2px;
  background: rgba(240, 230, 210, 0.14);
  margin-top: 6px;
}

#loading-bar-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, rgba(180, 140, 82, 0.35), #f5dca4 85%, #ffffff);
  box-shadow: 0 0 12px rgba(245, 210, 138, 0.65);
  transition: width 0.22s ease-out;
}

#loading-bar-spark {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fff6dc;
  box-shadow: 0 0 14px 3px rgba(255, 214, 132, 0.9);
  transform: translate(-50%, -50%);
  transition: left 0.22s ease-out;
}

#loading-stage {
  font-size: 12px;
  letter-spacing: 0.38em;
  text-indent: 0.38em;
  color: rgba(236, 224, 200, 0.66);
}

/* =========================================================================
   2. MINIMALIST LIVE-3D MAIN MENU (Ghost of Tsushima Poetic Left Layout)
   ========================================================================= */
#main-menu {
  position: absolute;
  inset: 0;
  z-index: 32;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(44px, 7vh, 84px) clamp(40px, 6.5vw, 108px);
  background: linear-gradient(
    90deg,
    rgba(6, 6, 9, 0.72) 0%,
    rgba(6, 6, 9, 0.34) 34%,
    rgba(6, 6, 9, 0.0) 66%
  );
  transition: opacity 0.65s ease;
}

.menu-brand {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
}

.menu-seal {
  display: inline-block;
  padding: 2px 9px;
  border: 1px solid rgba(196, 46, 36, 0.78);
  background: rgba(132, 20, 16, 0.22);
  color: #e24e3f;
  font-size: 11px;
  letter-spacing: 0.36em;
  text-indent: 0.36em;
}

.menu-title {
  font-size: clamp(44px, 6vw, 76px);
  font-weight: 400;
  letter-spacing: 0.28em;
  color: #f7f0e2;
  text-shadow: 0 8px 36px rgba(0, 0, 0, 0.88);
}

.menu-nav {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: clamp(12px, 3vh, 36px);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 22px 10px 0;
  background: transparent;
  border: none;
  color: rgba(240, 230, 212, 0.74);
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.28em;
  cursor: pointer;
  transition: color 0.22s ease, transform 0.22s ease;
}

.menu-item em {
  font-style: normal;
  color: #ebcf94;
}

.menu-item-mark {
  width: 18px;
  height: 1px;
  background: rgba(235, 207, 148, 0.35);
  transition: width 0.24s ease, background 0.24s ease, box-shadow 0.24s ease;
}

.menu-item-primary {
  font-size: 22px;
  color: #fbf4e6;
  margin-bottom: 4px;
}

.menu-item-primary .menu-item-mark {
  width: 28px;
  height: 2px;
  background: #e44838;
  box-shadow: 0 0 10px rgba(228, 72, 56, 0.65);
}

.menu-item:hover {
  color: #fff9ee;
  transform: translateX(6px);
}

.menu-item:hover .menu-item-mark {
  width: 38px;
  background: #f5dca2;
  box-shadow: 0 0 12px rgba(245, 220, 162, 0.7);
}

.menu-item-primary:hover .menu-item-mark {
  width: 46px;
  background: #ff5947;
}

/* =========================================================================
   3. MINIMALIST CONTROLS MODAL
   ========================================================================= */
#controls-modal {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(5, 5, 8, 0.68);
  backdrop-filter: blur(8px);
  transition: opacity 0.3s ease;
}

.controls-card {
  min-width: min(420px, 88vw);
  padding: 34px 40px;
  background: rgba(12, 12, 16, 0.88);
  border-top: 1px solid rgba(232, 206, 152, 0.32);
  border-bottom: 1px solid rgba(232, 206, 152, 0.32);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.controls-title {
  font-size: 18px;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  color: #f3e4c3;
}

.controls-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.controls-list > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 9px;
  border-bottom: 1px solid rgba(255, 244, 220, 0.08);
  font-size: 14px;
  letter-spacing: 0.14em;
  color: rgba(242, 232, 214, 0.86);
}

.controls-list kbd {
  padding: 2px 9px;
  border: 1px solid rgba(232, 204, 148, 0.36);
  background: rgba(255, 248, 232, 0.06);
  color: #f3d799;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.1em;
}

.ghost-action-btn {
  padding: 9px 30px;
  background: transparent;
  border: 1px solid rgba(232, 208, 160, 0.38);
  color: rgba(244, 235, 218, 0.88);
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  cursor: pointer;
  transition: all 0.22s ease;
}

.ghost-action-btn:hover {
  background: rgba(240, 214, 162, 0.14);
  border-color: rgba(248, 224, 172, 0.82);
  color: #ffffff;
}

/* =========================================================================
   4. CINEMATIC 2.39:1 LETTERBOX & CALLIGRAPHIC INTRO CAPTION
   ========================================================================= */
#cinematic-overlay {
  position: absolute;
  inset: 0;
  z-index: 28;
  pointer-events: none;
  transition: opacity 0.45s ease;
}

.letterbox {
  position: absolute;
  left: 0;
  right: 0;
  height: 9.5vh;
  background: #040406;
  transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
}

.letterbox-top {
  top: 0;
}

.letterbox-bottom {
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 36px;
}

#cinematic-overlay.hidden .letterbox-top {
  transform: translateY(-100%);
}

#cinematic-overlay.hidden .letterbox-bottom {
  transform: translateY(100%);
}

.skip-intro-hint {
  pointer-events: auto;
  background: transparent;
  border: none;
  color: rgba(236, 226, 206, 0.45);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.26em;
  cursor: pointer;
  transition: color 0.2s ease;
}

.skip-intro-hint:hover {
  color: rgba(255, 244, 222, 0.9);
}

#intro-caption {
  position: absolute;
  left: clamp(42px, 6.5vw, 96px);
  bottom: 14vh;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: opacity 0.55s ease, transform 0.55s ease;
}

#intro-caption-sub {
  font-size: 12px;
  letter-spacing: 0.38em;
  color: rgba(235, 202, 142, 0.82);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
}

#intro-caption-main {
  font-size: clamp(24px, 3.1vw, 38px);
  letter-spacing: 0.28em;
  color: #f8f1e4;
  text-shadow: 0 6px 26px rgba(0, 0, 0, 0.95);
}

/* =========================================================================
   5. IN-GAME TOP BAR, COMBAT HUD & DUEL END OVERLAY
   ========================================================================= */
#top-bar {
  position: absolute;
  top: 18px;
  right: 22px;
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: opacity 0.4s ease;
}

.weather-pills {
  display: flex;
  background: rgba(10, 10, 12, 0.52);
  border: 1px solid rgba(235, 218, 186, 0.18);
  border-radius: 2px;
  backdrop-filter: blur(6px);
  overflow: hidden;
}

.pill, .icon-pill {
  background: transparent;
  border: none;
  color: rgba(240, 232, 216, 0.68);
  padding: 6px 12px;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.14em;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pill:hover, .icon-pill:hover {
  color: #fff8ea;
  background: rgba(255, 240, 210, 0.1);
}

.pill.active {
  color: #120e0a;
  background: rgba(235, 205, 148, 0.9);
  font-weight: 600;
}

.icon-pill {
  background: rgba(10, 10, 12, 0.52);
  border: 1px solid rgba(235, 218, 186, 0.18);
  border-radius: 2px;
  backdrop-filter: blur(6px);
}

.icon-pill.muted {
  color: rgba(220, 90, 75, 0.9);
  border-color: rgba(220, 90, 75, 0.45);
}

.start-btn {
  padding: 11px 38px;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: 0.32em;
  text-indent: 0.32em;
  color: #130e0a;
  background: linear-gradient(180deg, #ebd09c 0%, #c79c57 100%);
  border: none;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.22s ease;
  box-shadow: 0 6px 26px rgba(212, 165, 88, 0.32);
}

.start-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 32px rgba(232, 186, 106, 0.52);
}

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 15;
  transition: opacity 0.45s ease;
}

#boss-hud {
  position: absolute;
  top: 26px;
  left: 50%;
  transform: translateX(-50%);
  width: min(500px, 68vw);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.boss-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2px;
}

#boss-name {
  font-size: 15px;
  letter-spacing: 0.22em;
  color: #efe4ce;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
}

#boss-lives {
  display: flex;
  gap: 8px;
}

.life-diamond {
  width: 9px;
  height: 9px;
  transform: rotate(45deg);
  border: 1px solid rgba(230, 80, 65, 0.65);
  background: transparent;
  transition: background 0.25s ease, box-shadow 0.25s ease;
}

.life-diamond.active {
  background: #d93426;
  box-shadow: 0 0 10px rgba(225, 55, 38, 0.85);
}

.bar-track {
  width: 100%;
  background: rgba(12, 10, 10, 0.68);
  border: 1px solid rgba(235, 220, 195, 0.18);
  overflow: hidden;
}

.boss-hp-track {
  height: 7px;
}

.bar-fill {
  height: 100%;
  width: 100%;
  transform-origin: left center;
  transition: width 0.12s ease-out;
}

.hp-fill {
  background: linear-gradient(90deg, #8b1e18, #cf372b);
}

.posture-wrap {
  width: 82%;
  height: 5px;
  margin: 0 auto;
  background: rgba(14, 12, 10, 0.68);
  border: 1px solid rgba(245, 208, 132, 0.22);
  position: relative;
  overflow: hidden;
}

.posture-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 0%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, #e39228, #ffe084, #e39228);
  box-shadow: 0 0 10px rgba(255, 190, 72, 0.75);
  transition: width 0.08s ease-out;
}

#perilous-flash {
  position: absolute;
  top: 24%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 74px;
  font-weight: 700;
  color: #e6261a;
  text-shadow: 0 0 28px rgba(255, 42, 24, 0.92), 0 4px 16px rgba(0, 0, 0, 0.95);
  transition: opacity 0.12s ease, transform 0.14s ease;
}

#combat-banner {
  position: absolute;
  top: 16%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  letter-spacing: 0.36em;
  text-indent: 0.36em;
  color: #f6dca0;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95);
  transition: opacity 0.22s ease;
}

#combat-banner.crimson {
  color: #f2483b;
}

#lock-reticle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255, 244, 218, 0.92);
  box-shadow: 0 0 12px rgba(255, 224, 164, 0.9);
  transform: translate(-50%, -50%);
}

#deathblow-reticle {
  position: absolute;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid rgba(235, 44, 32, 0.95);
  background: radial-gradient(circle, rgba(225, 32, 22, 0.75) 0%, rgba(120, 10, 8, 0.1) 72%);
  box-shadow: 0 0 26px rgba(255, 38, 24, 0.95);
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
}

#deathblow-reticle span {
  font-size: 13px;
  letter-spacing: 0.12em;
  color: #fff2ee;
}

#player-hud {
  position: absolute;
  left: 34px;
  bottom: 28px;
  width: min(320px, 46vw);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player-tools {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tool-slot {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  background: rgba(12, 11, 13, 0.62);
  border: 1px solid rgba(235, 218, 186, 0.22);
  font-size: 12px;
  overflow: hidden;
}

.tool-key {
  color: #e6c687;
  font-size: 11px;
}

.tool-label {
  color: rgba(240, 232, 216, 0.78);
}

#gourd-count {
  color: #f4dfae;
  font-weight: 600;
}

#stasis-cd-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  width: 0%;
  background: #f0c05a;
}

.focus-orbs {
  display: flex;
  gap: 7px;
  margin-left: auto;
}

.focus-orb {
  width: 12px;
  height: 12px;
  transform: rotate(45deg);
  border: 1px solid rgba(242, 204, 128, 0.55);
  background: rgba(18, 15, 12, 0.72);
  overflow: hidden;
  position: relative;
}

.focus-orb i {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ffd97d, #eb9426);
  transform-origin: bottom center;
  transform: scaleY(0);
}

.focus-orb.charged {
  box-shadow: 0 0 12px rgba(255, 198, 88, 0.9);
  border-color: #ffe8a3;
}

.player-posture-wrap {
  width: 100%;
  height: 4px;
}

.player-hp-track {
  height: 7px;
}

.player-hp-fill {
  background: linear-gradient(90deg, #982d24, #d95140);
}

#end-overlay {
  position: absolute;
  inset: 0;
  z-index: 35;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6, 5, 7, 0.72);
  backdrop-filter: blur(5px);
  transition: opacity 0.55s ease;
}

.end-card {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

#end-kanji {
  font-size: 92px;
  letter-spacing: 0.14em;
  color: #cf2f24;
  text-shadow: 0 0 36px rgba(215, 42, 30, 0.72);
}

#end-kanji.victory {
  color: #f0cf88;
  text-shadow: 0 0 38px rgba(240, 200, 118, 0.75);
}

#end-sub {
  font-size: 14px;
  letter-spacing: 0.36em;
  text-indent: 0.36em;
  color: rgba(236, 224, 202, 0.75);
  margin-bottom: 10px;
}

.end-actions {
  display: flex;
  gap: 14px;
  align-items: center;
}

  </style>
</head>
<body>
<div id="game-root">
  <canvas id="game-canvas"></canvas>

  <!-- Dynamic Ink & Crimson Maple Loading Screen -->
  <div id="loading-screen">
    <canvas id="loading-canvas"></canvas>
    <div class="loading-center">
      <div class="loading-seal">对马遗风</div>
      <h1 class="loading-title">风刃草偃</h1>
      <div class="loading-bar-wrap">
        <div id="loading-bar-fill"></div>
        <div id="loading-bar-spark"></div>
      </div>
      <div id="loading-stage">晨雾渐起</div>
    </div>
  </div>

  <!-- Minimalist Live-3D Main Menu -->
  <div id="main-menu" class="hidden">
    <div class="menu-brand">
      <span class="menu-seal">剑戟决死</span>
      <h1 class="menu-title">风刃草偃</h1>
    </div>

    <nav class="menu-nav" aria-label="主菜单">
      <button id="btn-start-game" class="menu-item menu-item-primary" type="button">
        <span class="menu-item-mark"></span>
        <span class="menu-item-label">拔刀入阵</span>
      </button>
      <button id="btn-menu-weather" class="menu-item" type="button">
        <span class="menu-item-mark"></span>
        <span class="menu-item-label">天象 · <em id="menu-weather-name">残阳</em></span>
      </button>
      <button id="btn-menu-controls" class="menu-item" type="button">
        <span class="menu-item-mark"></span>
        <span class="menu-item-label">操作要诀</span>
      </button>
      <button id="btn-menu-audio" class="menu-item" type="button">
        <span class="menu-item-mark"></span>
        <span class="menu-item-label">声效 · <em id="menu-audio-name">启</em></span>
      </button>
    </nav>
  </div>

  <!-- Minimalist Controls Sheet Modal -->
  <div id="controls-modal" class="hidden">
    <div class="controls-card">
      <div class="controls-title">操作要诀</div>
      <div class="controls-list">
        <div><kbd>左键</kbd><span>五段连斩</span></div>
        <div><kbd>右键</kbd><span>格挡 · 弹反</span></div>
        <div><kbd>E</kbd><span>识破 · 蓄力居合</span></div>
        <div><kbd>Shift</kbd><span>垫步 · 看破踩刀</span></div>
        <div><kbd>空格</kbd><span>跃起 · 踏破下段</span></div>
        <div><kbd>Q / R / F</kbd><span>止风 · 伤药 · 忍杀</span></div>
      </div>
      <button id="btn-close-controls" class="ghost-action-btn" type="button">返回</button>
    </div>
  </div>

  <!-- Cinematic 2.39:1 Letterbox & Intro Title Card -->
  <div id="cinematic-overlay" class="hidden">
    <div class="letterbox letterbox-top"></div>
    <div class="letterbox letterbox-bottom">
      <button id="btn-skip-intro" class="skip-intro-hint" type="button">空格 略过</button>
    </div>
    <div id="intro-caption" class="hidden">
      <div id="intro-caption-sub"></div>
      <div id="intro-caption-main"></div>
    </div>
  </div>

  <!-- Minimalist Top-Right Weather & Sound Micro-Controls (In-Game) -->
  <div id="top-bar" class="hidden">
    <div class="weather-pills" role="group" aria-label="天象">
      <button class="pill active" data-weather="dusk" type="button">残阳</button>
      <button class="pill" data-weather="overcast" type="button">山雨</button>
      <button class="pill" data-weather="storm" type="button">雷暴</button>
      <button class="pill" data-weather="mist" type="button">残霞</button>
    </div>
    <button id="btn-mute" class="icon-pill" type="button" title="静音切换">音</button>
  </div>

  <!-- Active Combat HUD -->
  <div id="hud" class="hidden">
    <div id="boss-hud">
      <div class="boss-header">
        <span id="boss-name">孤影剑圣 · 朽木玄斋</span>
        <div id="boss-lives">
          <span class="life-diamond active"></span>
          <span class="life-diamond active"></span>
        </div>
      </div>
      <div class="bar-track boss-hp-track">
